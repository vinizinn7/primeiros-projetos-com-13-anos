<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tarefa</title>
  <style>
    body {
      background: #1e1e2f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #2e2e3e;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 300px; /* Deixa a largura fixa */
    }

    .login-box h2 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    .login-box label {
      color: #cccccc;
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .login-box input {
      display: block;
      width: 100%;
      margin-bottom: 20px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-box button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <header class="Login">
      <h2>Login</h2>

      <label for="email">Email</label>
      <input type="text" name="email" id="email" placeholder="Digite seu email">

      <label for="senha">Senha</label>
      <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

      <button onclick="entrar()">Entrar</button>
      <div id="color"> </div>
    </header>
    <script>
        function entrar(){
            let email = document.getElementById("email").value
           let senha = document.getElementById("senha").value
            if(senha == '' && email == ''){
                alert('senha ou email invalido, por favor digite o componente certo!')
            }else{ 
               window.location.href = 'file:///C:/Users/Vini/Documents/estudos/cursoJS/projetos/DCdocumentacao.html'
            }
        }
    </script>
    <header>

    </header>
  </div>
</body>
</html>
