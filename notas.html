<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f7;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2rem;
            color: #4caf50;
        }
        .nota, .resultado {
            background-color: #e0f7fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 1.2rem;
        }
        .aprovado {
            color: #388e3c;
            font-weight: bold;
        }
        .reprovado {
            color: #d32f2f;
        }
        button {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Média Escolar</h1>

        <div class="nota" id="nota1"></div>
        <div class="resultado" id="r1"></div>

        <div class="nota" id="nota2"></div>
        <div class="resultado" id="r2"></div>

        <div class="nota" id="nota3"></div>
        <div class="resultado" id="r3"></div>

        <div class="nota" id="nota4"></div>
        <div class="resultado" id="r4"></div>

        <button onclick="iniciar()">Calcular Notas</button>
    </div>

    <script>
        function iniciar() {
            for (let i = 1; i <= 4; i++) {
                let nome = prompt(`Digite o nome do ${i}º aluno(a):`);
                let notas = [];
                for (let j = 1; j <= 4; j++) {
                    notas.push(Number(prompt(`Digite a ${j}ª nota de ${nome}:`)));
                }
                let media = (notas[0] + notas[1] + notas[2] + notas[3]) / 4;

                document.getElementById(`nota${i}`).innerText = `O aluno(a) ${nome} teve média ${media.toFixed(1)}`;

                const resultadoId = `r${i}`;
                const resultadoDiv = document.getElementById(resultadoId);
                resultadoDiv.classList.remove("aprovado", "reprovado");

                if (media >= 7) {
                    resultadoDiv.classList.add("aprovado");
                    resultadoDiv.innerText = `O aluno(a) ${nome} foi aprovado(a).`;
                } else {
                    resultadoDiv.classList.add("reprovado");
                    resultadoDiv.innerText = `O aluno(a) ${nome} foi reprovado(a).`;
                }
            }
        }
    </script>
</body>
</html>
